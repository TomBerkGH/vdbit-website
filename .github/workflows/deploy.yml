name: Deploy naar hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    # Een hangende FTP-verbinding mag de volgende deploys niet urenlang blokkeren.
    timeout-minutes: 10
    steps:
      # Actions vastgezet op een commit, zodat een verplaatste tag geen andere code kan uitvoeren.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Een PHP-bestand met een syntaxfout mag de server niet bereiken.
      - name: Controleer de PHP-syntax
        run: git ls-files -z '*.php' | xargs -0 php -l > /dev/null

      - name: Wachtwoord voor statistieken klaarzetten
        env:
          STATS_PASSWORD_HASH: ${{ secrets.STATS_PASSWORD_HASH }}
        run: printf "<?php\n\nreturn ['stats_password_hash' => '%s'];\n" "$STATS_PASSWORD_HASH" > includes/secrets.php

      # De FTP-action eist een map met een slash op het eind; die voegen we zelf toe.
      - name: Doelmap bepalen
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Secret FTP_SERVER_DIR is niet ingesteld"
            exit 1
          fi
          echo "SERVER_DIR=${FTP_SERVER_DIR%/}/" >> "$GITHUB_ENV"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.SERVER_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .idea/**
            .superpowers/**
            data/*.sqlite*
            .env
            README.md
            CLAUDE.md
